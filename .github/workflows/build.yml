name: Build BT TV APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y unzip curl zip

      - name: Prepare android.jar
        run: |
          mkdir -p build-plus
          cp "$ANDROID_HOME/platforms/android-34/android.jar" build-plus/android.jar
          ls -l build-plus/android.jar

      - name: Build base APK (API 22 only)
        run: |
          chmod +x tools/build.sh
          ./tools/build.sh 2>&1 | tee build.log || { echo '=== base build failed ==='; tail -c 80000 build.log; exit 1; }

      - name: Build Plus APK (new features)
        run: |
          chmod +x plus/build_plus.sh
          ANDROID_JAR="$PWD/build-plus/android.jar" ./plus/build_plus.sh 2>&1 | tee -a build.log

      - name: Show artifacts
        run: ls -l dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BT_APK
          path: dist/*.apk

      - name: Publish release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: BT TV 适配版 (latest)
          body: |
            BT 安卓电视适配版 —— 支持 Android 5.1.1 (API 22) 及以上。

            **安装前请先卸载原版 BT**（签名不同）。

            - `BT_Plus_*.apk` —— 带新功能（免费影视库 + 刷视频），推荐
            - `BT_TV_*.apk` —— 仅系统兼容适配

            详见 [README](https://github.com/xbfhm/bt#readme)
          files: dist/*.apk
          fail_on_unmatched_files: false

      - name: Dump log on failure
        if: failure()
        run: tail -c 80000 build.log || true
