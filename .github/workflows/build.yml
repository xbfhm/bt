name: Build BT TV APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y unzip curl

      - name: Build APK
        run: |
          chmod +x tools/build.sh
          ./tools/build.sh 2>&1 | tee build.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BT_TV_APK
          path: dist/*.apk

      - name: Publish release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: BT TV 适配版 (latest)
          body: |
            BT 安卓电视适配版 —— 支持 Android 5.1.1 (API 22) 及以上。

            **安装前请先卸载原版 BT**（签名不同）。

            详见 [README](https://github.com/xbfhm/bt#readme)
          files: dist/*.apk
          fail_on_unmatched_files: true

      - name: Dump log on failure
        if: failure()
        run: tail -c 80000 build.log || true
